# Default pipeline configuration.
#
# Provisional: no code reads this file yet. Each section lands with the slice
# that needs it (see docs/roadmap.md); the values are starting points, not
# tuned defaults. Segmentation/calling parameters arrive with Slice 6.

panel:
  name: null
  bed_file: null              # targets, BED
  tile_width: 100             # bp per tile along a target
  flank: 200                  # bp tiled either side of each target

extraction:
  min_mapping_quality: 20
  exclude_duplicates: true

tensor:                       # per-tile (position x insert size) histogram
  position_bins: 10           # bins across a tile
  insert_size_range: [50, 500]
  insert_size_bins: 45        # ~10 bp per bin
  channels:
    off_target_mate: true     # fraction of fragments whose mate misses every target

storage:
  format: hdf5                # hdf5 | npz

normalisation:
  method: tangent             # tangent | none
  n_components: 20            # rank of the panel-of-normals subspace
