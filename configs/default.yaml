# Default training configuration

panel:
  name: null
  bed_file: null
  kmer_size: 31
  min_anchor_density: 0.1
  spaced_seeds:
    enabled: true
    weight: 28               # care positions per seed
    n_seeds: 4               # complementary seeds for SNP coverage
    similarity: 0.95         # expected per-base match rate (sequencing error + SNPs)
    tool: ales               # ales | iedera (ales supports weight > 16)

fingerprint:
  gc_bins: 100
  fragment_size_range: [50, 500]
  fragment_bins: 450

data:
  storage_format: hdf5        # hdf5 | npz | parquet
  normalisation: gc_loess     # gc_loess | total_count | none
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1

model:
  architecture: cnn_1d        # cnn_1d | transformer | mlp
  input_layout: target_x_feat # target_x_feat | target_x_channel_x_bin

training:
  batch_size: 32
  learning_rate: 1.0e-3
  epochs: 100
  early_stopping_patience: 10
  device: auto                # auto | cpu | cuda
